name: VeeR-EH1 CI
run-name: "VeeR-EH1 CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  schedule:
    - cron: '0 2 * * *' # run daily at 02:00 am (UTC)


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:

  Test-EH1-Regression:
    name: Test-EH1-Regression
    uses: ./.github/workflows/test-eh1-regression.yml

  Build-and-deploy-docs:
    name: Build-and-deploy-docs
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-docs.yml
